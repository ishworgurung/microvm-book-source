[package]
name = "ch04"
version = "0.1.0"
edition = "2021"
description = "Chapter 4: virtio-blk and virtio-net on the virtio-mmio transport"
publish = false

# Exact versions (=x.y.z), so the code in the book keeps building as the
# crates move on. Cargo.lock pins their dependencies too.
[dependencies]
kvm-ioctls = "=0.25.1"
kvm-bindings = { version = "=0.14.2", features = ["fam-wrappers"] }
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
linux-loader = { version = "=0.14.0", features = ["elf"] }
vm-superio = "=0.8.2"
vmm-sys-util = "=0.15.0"
virtio-queue = "=0.18.0"
virtio-bindings = "=0.2.7"
libc = "0.2"

[dev-dependencies]
virtio-queue = { version = "=0.18.0", features = ["test-utils"] }

[[bin]]
name = "vmm4"
path = "src/main.rs"
